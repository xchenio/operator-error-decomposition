name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The two evidence tests resolve a seal against a specific commit, and will skip
          # themselves if it is unavailable; a full history lets them actually run.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheel: no test requires CUDA.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run the suite
        run: python -m unittest discover -s tests -v

      - name: Verify the prediction ledger still stratifies as the manuscript states
        run: python scripts/analyze_prediction_ledger.py
